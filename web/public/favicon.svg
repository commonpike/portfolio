<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="pike::portfolio">
  <!-- The :: of the titles, as a mark: two colons, four dots, and nothing else —
       no plate behind them, so the browser's own chrome shows through and the mark
       sits in light and dark alike. #f60040 is primary.500 from src/theme.ts, the
       one colour it is worth repeating here: public/ is copied verbatim, so this
       file cannot read a token. Geometry mimics the text rather than a grid — the
       dots of a :: sit closer across than they do down, so the four centres make a
       13x20 rectangle, roughly 2:3 upright, not a square. Dots 8 wide, 5 apart
       across and 12 down. -->
  <g fill="#f60040">
    <circle cx="9.5" cy="6" r="4" />
    <circle cx="9.5" cy="26" r="4" />
    <circle cx="22.5" cy="6" r="4" />
    <circle cx="22.5" cy="26" r="4" />
  </g>
</svg>
